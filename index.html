<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Jadwal Shalat Kotawaringin Timur</title>


<style>

/* ================================
   DASAR
================================ */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#17332b;
}


/* ================================
   KOTAK UTAMA
================================ */

.sholat-box{

  width:100%;
  max-width:900px;

  margin:0 auto;

  background:#ffffff;

  border:1px solid #dfe9e5;

  border-radius:14px;

  padding:18px;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.07);

}


/* ================================
   JUDUL
================================ */

.head{

  text-align:center;

  margin-bottom:13px;

}

.title{

  color:#0b5d48;

  font-size:21px;

  font-weight:700;

}

.location{

  color:#6c7975;

  font-size:13px;

  margin-top:4px;

}


/* ================================
   TANGGAL
================================ */

.date{

  border-top:1px solid #e9efed;

  border-bottom:1px solid #e9efed;

  padding:10px 5px;

  text-align:center;

  margin-bottom:14px;

}

.masehi{

  font-size:14px;

  font-weight:700;

  color:#222;

}

.hijri{

  color:#0b5d48;

  font-size:13px;

  margin-top:4px;

}


/* ================================
   JADWAL SHALAT
================================ */

.times{

  display:grid;

  grid-template-columns:
    repeat(6,1fr);

  gap:7px;

}

.time{

  background:#f3f7f5;

  border-radius:8px;

  text-align:center;

  padding:10px 4px;

}

.name{

  display:block;

  font-size:11px;

  color:#687570;

  margin-bottom:5px;

}

.hour{

  display:block;

  font-size:18px;

  font-weight:700;

  color:#0b5d48;

}


/* ================================
   STATUS
================================ */

.status{

  text-align:center;

  color:#8a9692;

  font-size:10px;

  margin-top:10px;

}


/* ================================
   COUNTDOWN
================================ */

.countdown-box{

  margin-top:12px;

  background:#eef7f3;

  border:1px solid #d9ebe4;

  border-radius:9px;

  padding:10px;

  text-align:center;

}

.countdown-title{

  font-size:12px;

  color:#687570;

  margin-bottom:3px;

}

.countdown-time{

  font-size:22px;

  font-weight:700;

  color:#0b5d48;

  letter-spacing:1px;

}

.countdown-at{

  font-size:10px;

  color:#89948f;

  margin-top:2px;

}


/* ================================
   ERROR
================================ */

.error{

  display:none;

  text-align:center;

  color:#a94338;

  font-size:11px;

  margin-top:8px;

}


/* ================================
   HP
================================ */

@media(max-width:650px){

  .sholat-box{

    padding:14px;

    border-radius:11px;

  }

  .title{

    font-size:18px;

  }

  .times{

    grid-template-columns:
      repeat(3,1fr);

  }

  .hour{

    font-size:17px;

  }

  .countdown-time{

    font-size:20px;

  }

}

</style>

</head>


<body>


<!-- =================================
     WIDGET JADWAL SHALAT
================================= -->

<div class="sholat-box">


  <!-- JUDUL -->

  <div class="head">

    <div class="title">
      🕌 JADWAL SHALAT
    </div>

    <div class="location">
      Kabupaten Kotawaringin Timur
    </div>

  </div>


  <!-- TANGGAL -->

  <div class="date">

    <div
      class="masehi"
      id="masehi">

      Memuat tanggal...

    </div>


    <div
      class="hijri"
      id="hijri">

      Memuat tanggal Hijriah...

    </div>

  </div>


  <!-- JADWAL -->

  <div class="times">


    <div class="time">

      <span class="name">
        Imsak
      </span>

      <span
        class="hour"
        id="imsak">

        --:--

      </span>

    </div>


    <div class="time">

      <span class="name">
        Subuh
      </span>

      <span
        class="hour"
        id="subuh">

        --:--

      </span>

    </div>


    <div class="time">

      <span class="name">
        Dzuhur
      </span>

      <span
        class="hour"
        id="dzuhur">

        --:--

      </span>

    </div>


    <div class="time">

      <span class="name">
        Ashar
      </span>

      <span
        class="hour"
        id="ashar">

        --:--

      </span>

    </div>


    <div class="time">

      <span class="name">
        Maghrib
      </span>

      <span
        class="hour"
        id="maghrib">

        --:--

      </span>

    </div>


    <div class="time">

      <span class="name">
        Isya
      </span>

      <span
        class="hour"
        id="isya">

        --:--

      </span>

    </div>


  </div>


  <!-- STATUS -->

  <div
    class="status"
    id="status">

    Memuat jadwal shalat...

  </div>


  <!-- COUNTDOWN -->

  <div
    class="countdown-box"
    id="countdownBox">

    <div
      class="countdown-title"
      id="countdownTitle">

      Menuju waktu shalat berikutnya

    </div>


    <div
      class="countdown-time"
      id="countdown">

      --:--:--

    </div>


    <div
      class="countdown-at"
      id="countdownAt">

    </div>

  </div>


  <!-- ERROR -->

  <div
    class="error"
    id="error">

    Jadwal belum dapat dimuat.

  </div>


</div>


<script>

/* ==========================================
   ID KABUPATEN KOTAWARINGIN TIMUR
========================================== */

const ID_KOTIM =
"0bb4aec1710521c12ee76289d9440817";


/* ==========================================
   VARIABEL JADWAL
========================================== */

let jadwalHariIni = null;


/* ==========================================
   TANGGAL INDONESIA
========================================== */

function tampilkanTanggal(){

  const sekarang = new Date();


  /* TANGGAL MASEHI */

  const tanggalMasehi =
    new Intl.DateTimeFormat(
      "id-ID",
      {
        timeZone:"Asia/Jakarta",

        weekday:"long",

        day:"numeric",

        month:"long",

        year:"numeric"
      }
    ).format(sekarang);


  document.getElementById(
    "masehi"
  ).textContent = tanggalMasehi;


  /* TANGGAL HIJRIAH */

  try{

    let tanggalHijriah =
      new Intl.DateTimeFormat(
        "id-ID-u-ca-islamic",
        {
          timeZone:"Asia/Jakarta",

          day:"numeric",

          month:"long",

          year:"numeric"
        }
      ).format(sekarang);


    /*
      Beberapa browser dapat menghasilkan
      tambahan "H".

      Kita bersihkan agar tidak menjadi:
      "1448 H H"
    */

    tanggalHijriah =
      tanggalHijriah
        .replace(/\s+H\s+H$/," H")
        .replace(/\s+H$/,"");


    document.getElementById(
      "hijri"
    ).textContent =
      tanggalHijriah + " H";


  }catch(error){

    document.getElementById(
      "hijri"
    ).textContent =
      "";

  }

}


/* ==========================================
   AMBIL JADWAL DARI MYQURAN
========================================== */

async function ambilJadwal(){

  try{


    const url =
      "https://api.myquran.com/v3/sholat/jadwal/"
      +
      ID_KOTIM
      +
      "/today?tz=Asia/Jakarta";


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "API tidak merespons"
      );

    }


    const hasil =
      await response.json();


    console.log(
      "Data Jadwal Kotim:",
      hasil
    );


    if(
      !hasil.status ||
      !hasil.data ||
      !hasil.data.jadwal
    ){

      throw new Error(
        "Data jadwal tidak tersedia"
      );

    }


    /*
      API memberikan data seperti:

      data
       └── jadwal
            └── 2026-08-27
                 ├── imsak
                 ├── subuh
                 ├── dzuhur
                 ├── ashar
                 ├── maghrib
                 └── isya
    */


    const daftarTanggal =
      Object.keys(
        hasil.data.jadwal
      );


    if(
      daftarTanggal.length === 0
    ){

      throw new Error(
        "Tanggal jadwal kosong"
      );

    }


    const tanggal =
      daftarTanggal[0];


    jadwalHariIni =
      hasil.data.jadwal[tanggal];


    console.log(
      "Jadwal:",
      jadwalHariIni
    );


    /* ======================================
       TAMPILKAN JAM
    ====================================== */

    document.getElementById(
      "imsak"
    ).textContent =
      jadwalHariIni.imsak || "--:--";


    document.getElementById(
      "subuh"
    ).textContent =
      jadwalHariIni.subuh || "--:--";


    document.getElementById(
      "dzuhur"
    ).textContent =
      jadwalHariIni.dzuhur || "--:--";


    document.getElementById(
      "ashar"
    ).textContent =
      jadwalHariIni.ashar || "--:--";


    document.getElementById(
      "maghrib"
    ).textContent =
      jadwalHariIni.maghrib || "--:--";


    document.getElementById(
      "isya"
    ).textContent =
      jadwalHariIni.isya || "--:--";


    /* STATUS */

    document.getElementById(
      "status"
    ).textContent =
      "Jadwal hari ini • WIB";


    document.getElementById(
      "error"
    ).style.display =
      "none";


    /*
      Setelah jadwal berhasil dimuat,
      langsung jalankan countdown.
    */

    updateCountdown();


  }catch(error){


    console.error(
      "Kesalahan jadwal:",
      error
    );


    document.getElementById(
      "status"
    ).textContent =
      "Jadwal tidak dapat dimuat";


    document.getElementById(
      "error"
    ).style.display =
      "block";


  }

}


/* ==========================================
   COUNTDOWN
========================================== */

function updateCountdown(){

  if(!jadwalHariIni){

    return;

  }


  const sekarang =
    new Date();


  /*
    Daftar waktu shalat.

    Terbit dan Dhuha sengaja tidak
    dimasukkan karena yang ditampilkan
    hanya waktu shalat.
  */

  const daftarShalat = [

    {
      nama:"Imsak",
      waktu:jadwalHariIni.imsak
    },

    {
      nama:"Subuh",
      waktu:jadwalHariIni.subuh
    },

    {
      nama:"Dzuhur",
      waktu:jadwalHariIni.dzuhur
    },

    {
      nama:"Ashar",
      waktu:jadwalHariIni.ashar
    },

    {
      nama:"Maghrib",
      waktu:jadwalHariIni.maghrib
    },

    {
      nama:"Isya",
      waktu:jadwalHariIni.isya
    }

  ];


  let shalatBerikutnya =
    null;


  /*
    Cari waktu shalat
    yang belum lewat.
  */

  for(
    const shalat
    of daftarShalat
  ){


    if(
      !shalat.waktu ||
      shalat.waktu === "--:--"
    ){

      continue;

    }


    const bagian =
      shalat.waktu.split(":");


    const jam =
      parseInt(
        bagian[0],
        10
      );


    const menit =
      parseInt(
        bagian[1],
        10
      );


    const target =
      new Date(sekarang);


    target.setHours(
      jam,
      menit,
      0,
      0
    );


    if(
      target.getTime()
      >
      sekarang.getTime()
    ){

      shalatBerikutnya = {

        nama:
          shalat.nama,

        waktu:
          shalat.waktu,

        target:
          target

      };


      break;

    }

  }


  /*
    Jika semua waktu hari ini
    sudah lewat.

    Maka countdown diarahkan
    ke Subuh besok.
  */

  if(!shalatBerikutnya){

    document.getElementById(
      "countdownTitle"
    ).textContent =
      "Menuju Subuh besok";


    document.getElementById(
      "countdown"
    ).textContent =
      "--:--:--";


    document.getElementById(
      "countdownAt"
    ).textContent =
      "Jadwal hari ini telah selesai";


    return;

  }


  /* ======================================
     HITUNG SELISIH
  ====================================== */

  const selisih =
    shalatBerikutnya.target.getTime()
    -
    sekarang.getTime();


  let totalDetik =
    Math.floor(
      selisih / 1000
    );


  const jam =
    Math.floor(
      totalDetik / 3600
    );


  totalDetik =
    totalDetik % 3600;


  const menit =
    Math.floor(
      totalDetik / 60
    );


  const detik =
    totalDetik % 60;


  const hh =
    String(jam)
      .padStart(2,"0");


  const mm =
    String(menit)
      .padStart(2,"0");


  const ss =
    String(detik)
      .padStart(2,"0");


  /* ======================================
     TAMPILKAN COUNTDOWN
  ====================================== */

  document.getElementById(
    "countdownTitle"
  ).textContent =
    "Menuju "
    +
    shalatBerikutnya.nama;


  document.getElementById(
    "countdown"
  ).textContent =
    hh
    +
    ":"
    +
    mm
    +
    ":"
    +
    ss;


  document.getElementById(
    "countdownAt"
  ).textContent =
    "Pukul "
    +
    shalatBerikutnya.waktu
    +
    " WIB";

}


/* ==========================================
   JALANKAN SAAT HALAMAN DIBUKA
========================================== */

tampilkanTanggal();

ambilJadwal();


/* ==========================================
   COUNTDOWN UPDATE SETIAP 1 DETIK
========================================== */

setInterval(
  updateCountdown,
  1000
);


/* ==========================================
   REFRESH JADWAL SETIAP 30 MENIT
========================================== */

setInterval(
  ambilJadwal,
  30 * 60 * 1000
);


/* ==========================================
   UPDATE TANGGAL SETIAP 1 JAM
========================================== */

setInterval(
  tampilkanTanggal,
  60 * 60 * 1000
);

</script>


</body>

</html>
