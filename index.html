<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jadwal Shalat Kotawaringin Timur</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#17332b;
}

.sholat-box{
  width:100%;
  max-width:760px;
  margin:0 auto;
  background:#ffffff;
  border:1px solid #e2ebe7;
  border-radius:12px;
  padding:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.head{
  text-align:center;
  margin-bottom:12px;
}

.title{
  color:#0b5d48;
  font-size:18px;
  font-weight:700;
}

.location{
  color:#687871;
  font-size:12px;
  margin-top:3px;
}

.date{
  border-top:1px solid #edf1ef;
  border-bottom:1px solid #edf1ef;
  padding:9px 4px;
  text-align:center;
  margin-bottom:12px;
}

.masehi{
  font-size:13px;
  font-weight:700;
}

.hijri{
  color:#0b5d48;
  font-size:12px;
  margin-top:3px;
}

.times{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
}

.time{
  background:#f4f8f6;
  border-radius:7px;
  text-align:center;
  padding:9px 3px;
}

.name{
  display:block;
  font-size:11px;
  color:#687871;
  margin-bottom:4px;
}

.hour{
  display:block;
  color:#0b5d48;
  font-size:17px;
  font-weight:700;
}

.status{
  text-align:center;
  color:#8a9792;
  font-size:10px;
  margin-top:10px;
}

.error{
  text-align:center;
  color:#b44337;
  font-size:11px;
  margin-top:8px;
}

@media(max-width:600px){

  .sholat-box{
    padding:13px;
  }

  .times{
    grid-template-columns:repeat(3,1fr);
  }

  .hour{
    font-size:16px;
  }
}
</style>

</head>

<body>

<div class="sholat-box">

  <div class="head">

    <div class="title">
      🕌 JADWAL SHALAT
    </div>

    <div class="location">
      Kabupaten Kotawaringin Timur
    </div>

  </div>


  <div class="date">

    <div class="masehi" id="masehi">
      Memuat tanggal...
    </div>

    <div class="hijri" id="hijri">
      Memuat tanggal Hijriah...
    </div>

  </div>


  <div class="times">

    <div class="time">
      <span class="name">Imsak</span>
      <span class="hour" id="imsak">--:--</span>
    </div>

    <div class="time">
      <span class="name">Subuh</span>
      <span class="hour" id="subuh">--:--</span>
    </div>

    <div class="time">
      <span class="name">Dzuhur</span>
      <span class="hour" id="dzuhur">--:--</span>
    </div>

    <div class="time">
      <span class="name">Ashar</span>
      <span class="hour" id="ashar">--:--</span>
    </div>

    <div class="time">
      <span class="name">Maghrib</span>
      <span class="hour" id="maghrib">--:--</span>
    </div>

    <div class="time">
      <span class="name">Isya</span>
      <span class="hour" id="isya">--:--</span>
    </div>

  </div>


  <div class="status" id="status">
    Memuat jadwal...
  </div>

  <div class="error" id="error"></div>

</div>


<script>

/* ==========================================
   ID KABUPATEN KOTAWARINGIN TIMUR
   ========================================== */

const ID_KOTIM =
"0bb4aec1710521c12ee76289d9440817";


/* ==========================================
   TANGGAL HARI INI WIB
   ========================================== */

function tanggalWIB(){

  const now = new Date();

  const formatter =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Jakarta",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    );

  return formatter.format(now);

}


/* ==========================================
   TAMPILKAN TANGGAL MASEHI
   ========================================== */

function tampilkanTanggal(){

  const now = new Date();

  const tanggal =
    new Intl.DateTimeFormat(
      "id-ID",
      {
        timeZone:"Asia/Jakarta",
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    ).format(now);

  document.getElementById("masehi")
    .textContent = tanggal;


  /* TANGGAL HIJRIAH */

  try{

    const hijri =
      new Intl.DateTimeFormat(
        "id-ID-u-ca-islamic",
        {
          timeZone:"Asia/Jakarta",
          day:"numeric",
          month:"long",
          year:"numeric"
        }
      ).format(now);

    document.getElementById("hijri")
      .textContent = hijri + " H";

  }catch(e){

    document.getElementById("hijri")
      .textContent = "";

  }

}


/* ==========================================
   AMBIL JADWAL SHALAT
   ========================================== */

async function ambilJadwal(){

  try{

    const url =
      "https://api.myquran.com/v3/sholat/jadwal/"
      + ID_KOTIM
      + "/today?tz=Asia/Jakarta";


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Server API tidak merespons"
      );

    }


    const hasil =
      await response.json();


    console.log(
      "Data API:",
      hasil
    );


    if(
      !hasil.status ||
      !hasil.data ||
      !hasil.data.jadwal
    ){

      throw new Error(
        "Struktur data API tidak sesuai"
      );

    }


    /*
      API mengembalikan:

      data.jadwal
      └── 2026-08-27
          ├── imsak
          ├── subuh
          ├── dzuhur
          ├── ashar
          ├── maghrib
          └── isya
    */


    const daftarTanggal =
      Object.keys(
        hasil.data.jadwal
      );


    const tanggal =
      daftarTanggal[0];


    const jadwal =
      hasil.data.jadwal[tanggal];


    console.log(
      "Jadwal hari ini:",
      jadwal
    );


    /* ======================================
       MASUKKAN DATA KE TAMPILAN
       ====================================== */

    document.getElementById("imsak")
      .textContent =
      jadwal.imsak || "--:--";


    document.getElementById("subuh")
      .textContent =
      jadwal.subuh || "--:--";


    document.getElementById("dzuhur")
      .textContent =
      jadwal.dzuhur || "--:--";


    document.getElementById("ashar")
      .textContent =
      jadwal.ashar || "--:--";


    document.getElementById("maghrib")
      .textContent =
      jadwal.maghrib || "--:--";


    document.getElementById("isya")
      .textContent =
      jadwal.isya || "--:--";


    document.getElementById("status")
      .textContent =
      "Jadwal hari ini • WIB";


    document.getElementById("error")
      .textContent = "";


  }catch(error){

    console.error(
      "Error Jadwal Shalat:",
      error
    );


    document.getElementById("status")
      .textContent =
      "Jadwal tidak dapat dimuat";


    document.getElementById("error")
      .textContent =
      "Silakan refresh halaman.";


  }

}


/* ==========================================
   JALANKAN
   ========================================== */

tampilkanTanggal();

ambilJadwal();


/* ==========================================
   UPDATE OTOMATIS
   ========================================== */

setInterval(
  ambilJadwal,
  30 * 60 * 1000
);

setInterval(
  tampilkanTanggal,
  60 * 60 * 1000
);

</script>

</body>
</html>
