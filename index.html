<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Shalat Kotawaringin Timur</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:transparent;
    color:#17332b;
  }
  .sholat-box{
    width:100%;
    max-width:760px;
    margin:0 auto;
    background:#fff;
    border:1px solid #e2ebe7;
    border-radius:12px;
    padding:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
  }
  .head{
    text-align:center;
    margin-bottom:13px;
  }
  .title{
    color:#0b5d48;
    font-size:18px;
    font-weight:700;
  }
  .location{
    color:#687871;
    font-size:12px;
    margin-top:3px;
  }
  .date{
    border-top:1px solid #edf1ef;
    border-bottom:1px solid #edf1ef;
    padding:9px 4px;
    text-align:center;
    margin-bottom:12px;
  }
  .masehi{
    font-size:13px;
    font-weight:700;
  }
  .hijri{
    color:#0b5d48;
    font-size:12px;
    margin-top:3px;
  }
  .times{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
  }
  .time{
    background:#f4f8f6;
    border-radius:7px;
    text-align:center;
    padding:9px 3px;
  }
  .name{
    display:block;
    font-size:11px;
    color:#687871;
    margin-bottom:4px;
  }
  .hour{
    display:block;
    color:#0b5d48;
    font-size:17px;
    font-weight:700;
  }
  .status{
    text-align:center;
    color:#8a9792;
    font-size:10px;
    margin-top:10px;
  }
  .error{
    color:#a23c31;
    font-size:11px;
    text-align:center;
    margin-top:10px;
  }
  @media(max-width:600px){
    .sholat-box{padding:13px}
    .times{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>

<div class="sholat-box">
  <div class="head">
    <div class="title">🕌 JADWAL SHALAT</div>
    <div class="location">Kabupaten Kotawaringin Timur</div>
  </div>

  <div class="date">
    <div class="masehi" id="masehi">Memuat tanggal...</div>
    <div class="hijri" id="hijri">Memuat tanggal Hijriah...</div>
  </div>

  <div class="times">
    <div class="time"><span class="name">Imsak</span><span class="hour" id="imsak">--:--</span></div>
    <div class="time"><span class="name">Subuh</span><span class="hour" id="subuh">--:--</span></div>
    <div class="time"><span class="name">Dzuhur</span><span class="hour" id="dzuhur">--:--</span></div>
    <div class="time"><span class="name">Ashar</span><span class="hour" id="ashar">--:--</span></div>
    <div class="time"><span class="name">Maghrib</span><span class="hour" id="maghrib">--:--</span></div>
    <div class="time"><span class="name">Isya</span><span class="hour" id="isya">--:--</span></div>
  </div>

  <div class="status" id="status">Mengambil jadwal shalat...</div>
  <div class="error" id="error"></div>
</div>

<script>
/*
  ID MyQuran Kabupaten Kotawaringin Timur
*/
const ID_KOTIM = "0bb4aec1710521c12ee76289d9440817";

const bulanHijriah = [
  "Muharam","Safar","Rabiul Awal","Rabiul Akhir",
  "Jumadil Awal","Jumadil Akhir","Rajab","Syaban",
  "Ramadan","Syawal","Zulkaidah","Zulhijah"
];

/*
  Konversi tanggal Gregorian -> Hijriah secara aritmetika.
  Digunakan sebagai cadangan tampilan tanggal Hijriah agar widget
  tidak bergantung pada dukungan kalender Hijriah browser.
*/
function gregorianToHijri(date){
  let y=date.getUTCFullYear(), m=date.getUTCMonth()+1, d=date.getUTCDate();
  let jd = Math.floor((1461*(y+4800+Math.floor((m-14)/12)))/4)
         + Math.floor((367*(m-2-12*Math.floor((m-14)/12)))/12)
         - Math.floor((3*Math.floor((y+4900+Math.floor((m-14)/12))/100))/4)
         + d - 32075;

  let l=jd-1948440+10632;
  let n=Math.floor((l-1)/10631);
  l=l-10631*n+354;
  let j=(Math.floor((10985-l)/5316)*Math.floor((50*l)/17719))
      +(Math.floor(l/5670)*Math.floor((43*l)/15238));
  l=l-(Math.floor((30-j)/15)*Math.floor((17719*j)/50))
      -(Math.floor(j/16)*Math.floor((15238*j)/43))+29;
  let mm=Math.floor((24*l)/709);
  let dd=l-Math.floor((709*mm)/24);
  let yy=30*n+j-30;

  return `${dd} ${bulanHijriah[mm-1]} ${yy} H`;
}

function tampilkanTanggal(){
  const now = new Date();

  const masehi = new Intl.DateTimeFormat("id-ID",{
    timeZone:"Asia/Jakarta",
    weekday:"long",
    day:"numeric",
    month:"long",
    year:"numeric"
  }).format(now);

  document.getElementById("masehi").textContent = masehi;

  /*
    Gunakan kalender Hijriah browser jika tersedia.
    Jika tidak tersedia, gunakan konversi cadangan.
  */
  try{
    const h = new Intl.DateTimeFormat("id-ID-u-ca-islamic",{
      timeZone:"Asia/Jakarta",
      day:"numeric",
      month:"long",
      year:"numeric"
    }).format(now);

    document.getElementById("hijri").textContent = h + " H";
  }catch(e){
    const utc = new Date(now.toLocaleString("en-US",{timeZone:"Asia/Jakarta"}));
    document.getElementById("hijri").textContent = gregorianToHijri(utc);
  }
}

async function ambilJadwal(){
  try{
    const url =
      "https://api.myquran.com/v3/sholat/jadwal/" +
      ID_KOTIM +
      "/today?tz=Asia/Jakarta";

    const response = await fetch(url,{cache:"no-store"});

    if(!response.ok){
      throw new Error("Server jadwal tidak merespons");
    }

    const json = await response.json();

    if(!json.status || !json.data || !json.data.jadwal){
      throw new Error("Data jadwal tidak tersedia");
    }

    const j=json.data.jadwal;

    document.getElementById("imsak").textContent=j.imsak || "--:--";
    document.getElementById("subuh").textContent=j.subuh || "--:--";
    document.getElementById("dzuhur").textContent=j.dzuhur || "--:--";
    document.getElementById("ashar").textContent=j.ashar || "--:--";
    document.getElementById("maghrib").textContent=j.maghrib || "--:--";
    document.getElementById("isya").textContent=j.isya || "--:--";

    document.getElementById("status").textContent="Jadwal hari ini • WIB";
    document.getElementById("error").textContent="";
  }catch(err){
    console.error(err);
    document.getElementById("status").textContent="Jadwal belum dapat dimuat";
    document.getElementById("error").textContent=
      "Silakan refresh halaman jika jadwal belum tampil.";
  }
}

tampilkanTanggal();
ambilJadwal();

/*
  Cek ulang setiap 30 menit.
*/
setInterval(ambilJadwal,30*60*1000);

/*
  Saat tanggal berganti, perbarui tanggal dan jadwal.
*/
setInterval(()=>{
  tampilkanTanggal();
  ambilJadwal();
},60*60*1000);
</script>

</body>
</html>
